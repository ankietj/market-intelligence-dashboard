name: Publish Market Intelligence Dashboard

# Strict Governance Rule: Manual Publishing Only.
# No cron jobs, schedule triggers, or automated intraday refreshes are permitted.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Publishing justification / note'
        required: false
        default: 'Manual market intelligence release'

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment at a time, never cancel in progress
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Dashboard Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Public Data Contract & Checksums
        run: |
          python scripts/validate_public_data.py --data-dir public/data/latest

      - name: Security & Privacy Sanitization Audit
        run: |
          python scripts/sanitize_public_data.py --data-dir public/data --check

      - name: Run End-to-End Snapshot Verification
        run: |
          python scripts/verify_snapshot.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm ci || npm install

      - name: Build Static Production Application
        run: |
          npm run build

      - name: Verify Static Build Artifacts
        run: |
          test -f dist/index.html || exit 1
          test -f dist/data/latest/manifest.json || exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publication Handover Summary
        if: always()
        run: |
          echo "### 🏛️ Market Intelligence Dashboard Publishing Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Publication Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Published URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Data Verification:** 100% Critic Audited, Schema & Sanitization Confirmed" >> $GITHUB_STEP_SUMMARY
